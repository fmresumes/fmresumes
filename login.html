<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – ATS Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1e4fd6;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>ATS Checker Access</h2>
  <p>Please login to continue.</p>

  <button onclick="netlifyIdentity.open()">
    Login / Sign Up
  </button>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<script>
  // Redirect user after login
  if (window.netlifyIdentity) {

    window.netlifyIdentity.on("init", user => {
      if (user) {
        window.location.href = "/ats.html"; // change to your ATS page
      }
    });

    window.netlifyIdentity.on("login", () => {
      window.location.href = "/ats.html"; // change if needed
    });
  }
</script>

</body>
</html>
